<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding programme | Sample | Ever After by TeamAfot</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../demo/base.css">
<style>
  :root { --bg: #24131A; --paper: #FFFCF6; --ink: #2B1F22; --mute: #7A6A63; --accent: #8B2D45; --accent-2: #C59A52; --line: rgba(197,154,82,.45); }
  body { background: var(--bg); color: var(--ink); }
  .wrap { max-width: 600px; margin: 0 auto; padding: 4.5rem 1rem 7rem; }
  .booklet { background: var(--paper); border-radius: 6px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.6); overflow: hidden; }
  .pg { position: relative; padding: clamp(2.6rem, 8vw, 3.6rem) clamp(1.6rem, 6vw, 3rem); text-align: center; }
  .pg + .pg { border-top: 1px solid var(--line); }
  .pg--cover { padding-top: 4rem; padding-bottom: 4rem; background: var(--cover-bg, var(--paper)); color: var(--cover-ink, var(--ink)); }
  .pg--cover::before { content: ""; position: absolute; inset: 14px; border: 1px solid var(--line); pointer-events: none; }
  .kicker { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--cover-mute, var(--mute)); }
  .names { font-family: var(--head); font-weight: 400; font-size: var(--names-size, clamp(3rem, 12vw, 4.4rem)); line-height: 1.15; color: var(--cover-accent, var(--accent)); margin: .6rem 0; }
  .names span { color: var(--accent-2); }
  .orn { display: flex; align-items: center; justify-content: center; gap: .6rem; margin: 1.2rem auto; color: var(--accent-2); }
  .orn i { width: 60px; height: 1px; background: currentColor; opacity: .7; }
  .orn b { width: 7px; height: 7px; transform: rotate(45deg); background: currentColor; }
  .date { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; letter-spacing: .03em; }
  .venue { font-size: .82rem; letter-spacing: .2em; color: var(--cover-mute, var(--mute)); margin-top: .2rem; }
  .verse { font-family: var(--serif); font-style: italic; font-size: 1.1rem; line-height: 1.5; margin-top: 2rem; color: var(--cover-mute, var(--mute)); }
  .verse small { display: block; font-style: normal; font-family: var(--sans); font-size: .72rem; letter-spacing: .2em; margin-top: .4rem; }
  h2 { font-family: var(--head); font-weight: 400; font-size: var(--h2-size, clamp(2.2rem, 8vw, 2.9rem)); line-height: 1.2; color: var(--accent); margin-bottom: 1.4rem; }
  .order { list-style: none; margin: 0 auto; padding: 0; max-width: 26rem; counter-reset: o; }
  .order li { counter-increment: o; display: grid; grid-template-columns: 2rem 1fr; gap: .8rem; text-align: left; padding: .7rem 0; border-bottom: 1px dashed var(--line); }
  .order li::before { content: counter(o); font-family: var(--serif); font-weight: 600; font-size: 1.15rem; color: var(--accent-2); }
  .order b { display: block; font-weight: 500; font-size: 1rem; }
  .order span { color: var(--mute); font-size: .9rem; }
  .party { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem 1.5rem; max-width: 26rem; margin: 0 auto; }
  .party div small { display: block; font-size: .7rem; letter-spacing: .18em; color: var(--mute); }
  .party div p { font-family: var(--serif); font-weight: 600; font-size: 1.1rem; line-height: 1.3; }
  .party .wide { grid-column: 1 / -1; }
  .thanks p { font-family: var(--serif); font-size: 1.15rem; line-height: 1.6; max-width: 28rem; margin: 0 auto; }
  .thanks .sign { font-family: var(--head); font-size: var(--sign-size, 2.4rem); color: var(--accent); margin-top: 1rem; line-height: 1.2; }
  .sample { font-size: .78rem; color: var(--mute); margin-top: 1.6rem; }

  .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; padding: .9rem 1rem calc(.9rem + env(safe-area-inset-bottom)); background: rgba(20,12,16,.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .actions .btn { color: #FBF6EF; border-color: rgba(251,246,239,.4); }
  .actions .btn--main { background: #E9CF92; color: #24131A; border-color: #E9CF92; }

  @media print {
    @page { size: A5; margin: 10mm; }
    body { background: #fff; }
    .bar, .actions, .toast, .fx { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    .booklet { box-shadow: none; border-radius: 0; }
    .pg { break-inside: avoid; page-break-inside: avoid; }
    .pg--cover { break-after: page; page-break-after: always; min-height: 180mm; display: flex; flex-direction: column; justify-content: center; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="bar"><a class="bar__back" href="../designs/">← All designs</a><span class="bar__label">Sample wedding programme</span><a class="bar__cta" href="../#book">Get one like this</a></div>

<div class="wrap">
  <article class="booklet">
    <section class="pg pg--cover">
      <p class="kicker" data-k="kicker"></p>
      <h1 class="names" data-k="names"></h1>
      <div class="orn" aria-hidden="true"><i></i><b></b><i></i></div>
      <p class="date" data-k="date"></p>
      <p class="venue" data-k="venue"></p>
      <p class="verse"><span data-k="verse"></span><small data-k="verseRef"></small></p>
    </section>
    <section class="pg">
      <h2 data-k="ceremonyTitle"></h2>
      <ol class="order" data-list="ceremony"></ol>
    </section>
    <section class="pg">
      <h2 data-k="receptionTitle"></h2>
      <ol class="order" data-list="reception"></ol>
    </section>
    <section class="pg">
      <h2>The wedding party</h2>
      <div class="party" data-party></div>
    </section>
    <section class="pg thanks">
      <h2>Thank you</h2>
      <p data-k="thanks"></p>
      <p class="sign" data-k="sign"></p>
      <p class="sample">Sample programme by Ever After by TeamAfot. The couple, their party and all details are made up.</p>
    </section>
  </article>
</div>

<div class="actions">
  <button class="btn btn--main" id="print">Print or save as PDF</button>
  <a class="btn" id="site" href="#">See their wedding website</a>
</div>
